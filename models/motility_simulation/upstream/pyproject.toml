[project]
authors = [{ name = "m-jahn", email = "jahn@mpusp.mpg.de" }]
dependencies = ["pyyaml"]
description = "Coarse-grained 2D single-cell Salmonella motility simulation in liquid and agarose-like environments."
name = "salmonella-motility-simulation"
readme = "README.md"
requires-python = ">= 3.14"
version = "1.0.0"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/salmonella_motility_simulation"]

[project.scripts]
salmonella_motility_simulation = "salmonella_motility_simulation.__main__:main"

[tool.pyright]
pythonVersion = "3.14"
pythonPath = ".pixi/envs/default/bin/python"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", ".pixi", "**/.*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
simulation = "PYTHONPATH=src python -m salmonella_motility_simulation --output output/ppro"
simulation_plots_only = "PYTHONPATH=src python -m salmonella_motility_simulation --output output/ppro_from_tsv --from-tsv-prefix output/ppro"
formatting = "ruff check ./src && ruff format --check --diff ./src"

[tool.pixi.dependencies]
numpy = ">=2.4.3,<3"
pandas = ">=3.0.2,<4"
matplotlib = ">=3.10.9,<4"
pyyaml = ">=6.0.3,<7"
python = ">=3.14.4,<3.15"
ruff = ">=0.15.11,<0.16"
